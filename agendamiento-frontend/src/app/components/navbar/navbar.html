<nav class="navbar">
  <div class="navbar-brand" (click)="redirigirSegunRol()">
    <span class="brand-icon">♡</span>
    <span class="brand-name">MJ Salud</span>
  </div>

  <div class="navbar-links">
    <a routerLink="/" class="nav-link">Inicio</a>
    <a routerLink="#servicios" class="nav-link">Servicios</a>

    <!-- Mostrar enlaces según rol -->
    <ng-container *ngIf="isLoggedIn()">
      <a *ngIf="esAdministrador()" routerLink="/admin-dashboard" class="nav-link">Dashboard</a>
      <a *ngIf="esMedico()" routerLink="/medico" class="nav-link">Mi Panel</a>
      <a *ngIf="esPaciente()" routerLink="/citas" class="nav-link">Mis Citas</a>
    </ng-container>
  </div>

  <div class="navbar-actions">
    <!-- Mostrar información del usuario si está logueado -->
    <div *ngIf="isLoggedIn()" class="user-info">
      <span style="font-size: 14px; color: #4b5563; margin-right: 10px;">
        {{ authService.obtenerUsuario()?.nombreCompleto }}
      </span>
      <span style="font-size: 12px; color: #9ca3af; margin-right: 15px;">
        ({{ authService.obtenerUsuario()?.rol }})
      </span>
      <button (click)="cerrarSesion()" class="btn-logout-nav">
        Cerrar Sesión
      </button>
    </div>

    <!-- Botón de login si no está logueado -->
    <button *ngIf="!isLoggedIn()" routerLink="/login" class="btn-login-nav">
      Iniciar Sesión
    </button>
  </div>
</nav>

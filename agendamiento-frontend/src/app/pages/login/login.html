<!-- src/app/pages/login/login.html -->
<div class="login-container">
  <div class="login-card">
    <!-- Header -->
    <div class="login-header">
      <h2><i class="fas fa-sign-in-alt"></i> Iniciar Sesión</h2>
      <p class="login-subtitle">Ingresa a tu cuenta de MJ Salud</p>
    </div>

    <!-- Error message -->
    <div *ngIf="errorMessage" class="alert alert-error">
      <i class="fas fa-exclamation-circle"></i>
      <span><strong>Error:</strong> {{ errorMessage }}</span>
    </div>

    <!-- Login Form -->
    <form (ngSubmit)="onSubmit()" #loginForm="ngForm">
      <div class="form-group">
        <label for="email">
          <i class="fas fa-envelope"></i> Correo Electrónico
        </label>
        <input type="email" id="email" name="email" [(ngModel)]="correo" placeholder="ejemplo@email.com" required
          [disabled]="isLoading" autocomplete="email">
      </div>

      <div class="form-group">
        <label for="password">
          <i class="fas fa-lock"></i> Contraseña
        </label>
        <input type="password" id="password" name="password" [(ngModel)]="password" placeholder="••••••••" required
          [disabled]="isLoading" autocomplete="current-password">
      </div>

      <button type="submit" class="btn-login-primary" [disabled]="isLoading || !correo || !password">
        <span *ngIf="!isLoading">
          <i class="fas fa-sign-in-alt"></i> Ingresar
        </span>
        <span *ngIf="isLoading">
          <i class="fas fa-spinner fa-spin"></i> Procesando...
        </span>
      </button>
    </form>

    <!-- Footer -->
    <div class="login-footer">
      <button routerLink="/" class="btn-login-secondary" [disabled]="isLoading">
        <i class="fas fa-home"></i> Volver al Inicio
      </button>
      <p>
        ¿No tienes cuenta?
        <a (click)="irARegistro()" class="register-link">
          <i class="fas fa-user-plus"></i> Regístrate aquí
        </a>
      </p>
    </div>
  </div>
</div>

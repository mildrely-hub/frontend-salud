<div class="login-container">
  <!-- Error message -->
  <div *ngIf="errorMessage" class="alert alert-error">
    <strong>⚠️ Error:</strong> {{ errorMessage }}
  </div>

  <!-- Login Form -->
  <div class="login-card">
    <h2><i class="fas fa-sign-in-alt"></i> Iniciar Sesión</h2>

    <form (ngSubmit)="onSubmit()" #loginForm="ngForm">
      <div class="form-group">
        <label for="email">
          <i class="fas fa-envelope"></i> Correo Electrónico
        </label>
        <input type="email" id="email" name="email" [(ngModel)]="email" placeholder="ejemplo@email.com" required
          [disabled]="isLoading" autocomplete="email" /> <!-- ← CIERRA CON /> -->
      </div>

      <div class="form-group">
        <label for="password">
          <i class="fas fa-lock"></i> Contraseña
        </label>
        <input type="password" id="password" name="password" [(ngModel)]="password" placeholder="••••••••" required
          [disabled]="isLoading" autocomplete="current-password" /> <!-- ← CIERRA CON /> -->
      </div>

      <button type="submit" class="btn-login-primary" [disabled]="isLoading || !email || !password">
        <span *ngIf="!isLoading">
          <i class="fas fa-sign-in-alt"></i> Ingresar
        </span>
        <span *ngIf="isLoading">
          <i class="fas fa-spinner fa-spin"></i> Procesando...
        </span>
      </button>
    </form>

    <!-- Credenciales de Demo -->
    <div class="demo-section">
      <h4><i class="fas fa-vial"></i> Credenciales de Prueba</h4>
      <div class="demo-credentials">
        <div *ngFor="let cred of credencialesDemo" class="demo-option" (click)="usarCredencialDemo(cred)">
          <strong>{{ cred.rol }}</strong><br>
          <small>{{ cred.email }}</small>
        </div>
      </div>
      <p class="demo-note">
        <i class="fas fa-info-circle"></i>
        Usa estas credenciales para probar el sistema. Contraseña: <code>password123</code>
      </p>
    </div>

    <!-- Footer -->
    <div class="login-footer">
      <button routerLink="/" class="btn-login-secondary" [disabled]="isLoading">
        <i class="fas fa-home"></i> Volver al Inicio
      </button>
      <p>
        ¿No tienes cuenta?
        <a (click)="irARegistro()" class="register-link">
          <i class="fas fa-user-plus"></i> Regístrate aquí
        </a>
      </p>
    </div>
  </div>
</div>
